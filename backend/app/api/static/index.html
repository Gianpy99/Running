<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Running Coach — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1720; --panel: #17212b; --panel2: #1e2b38; --line: #293a49;
    --text: #e6edf3; --muted: #8ba0b3; --accent: #3fb6ff; --green: #35c46b;
    --amber: #f2b134; --red: #ef5350; --purple: #b07cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
  header h1 { font-size: 1.25rem; margin: 0; }
  header .sub { color: var(--muted); font-size: .85rem; }
  header .spacer { flex: 1; }
  header a { color: var(--accent); text-decoration: none; font-size: .85rem; }
  main { padding: 1.2rem 1.5rem 3rem; max-width: 1280px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
           gap: .9rem; margin-bottom: 1.4rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 1rem 1.1rem; }
  .card .label { color: var(--muted); font-size: .78rem; text-transform: uppercase;
                 letter-spacing: .04em; }
  .card .value { font-size: 1.8rem; font-weight: 650; margin-top: .3rem; }
  .card .unit { font-size: .9rem; color: var(--muted); font-weight: 400; }
  .pill { display: inline-block; padding: .15rem .6rem; border-radius: 999px;
          font-size: .8rem; font-weight: 600; }
  .pill.green { background: rgba(53,196,107,.18); color: var(--green); }
  .pill.amber { background: rgba(242,177,52,.18); color: var(--amber); }
  .pill.red { background: rgba(239,83,80,.18); color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.1rem; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 1rem 1.1rem; }
  .panel h2 { font-size: .95rem; margin: 0 0 .2rem; }
  .panel .hint { color: var(--muted); font-size: .78rem; margin: 0 0 .8rem; }
  .panel.wide { grid-column: 1 / -1; }
  canvas { max-height: 300px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel2); }
  .type { font-size: .72rem; padding: .1rem .5rem; border-radius: 6px; background: var(--panel2);
          color: var(--muted); }
  .warn { color: var(--amber); }
  .reasons { margin: .4rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .82rem; }
  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
             align-items: center; justify-content: center; padding: 1rem; z-index: 20; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
           width: min(920px, 100%); max-height: 90vh; overflow: auto; padding: 1.2rem 1.4rem; }
  .modal h3 { margin: 0 0 .2rem; }
  .modal .close { float: right; cursor: pointer; color: var(--muted); font-size: 1.3rem;
                  line-height: 1; border: none; background: none; }
  .modal .narrative { background: var(--panel2); border-radius: 8px; padding: .8rem 1rem;
                      color: var(--text); font-size: .9rem; margin: .8rem 0; }
  .loading { color: var(--muted); padding: 2rem; text-align: center; }
  .upload-btn { background: var(--accent); color: #08151f; border: none; border-radius: 8px;
                padding: .45rem .8rem; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .upload-btn:hover { filter: brightness(1.08); }
  .upload-btn:disabled { opacity: .6; cursor: default; }
  .upload-status { font-size: .8rem; color: var(--muted); }
  .upload-status.ok { color: var(--green); }
  .upload-status.err { color: var(--red); }
  /* treadmill phase builder */
  .tm-grid { display: grid; grid-template-columns: 1.4rem 1fr 4.4rem 5rem 4.4rem 1.4rem;
             gap: .4rem; align-items: center; margin-bottom: .4rem; max-width: 34rem; }
  .tm-grid .head { color: var(--muted); font-size: .7rem; text-transform: uppercase;
                   letter-spacing: .04em; }
  .tm-grid input, .tm-grid select { background: var(--panel2); color: var(--text); width: 100%;
      border: 1px solid #2a3a48; border-radius: 6px; padding: .35rem; font: inherit;
      font-size: .85rem; }
  .tm-grid input[type=number] { text-align: right; }
  .tm-grid input[type=checkbox] { width: auto; accent-color: var(--accent); }
  .tm-row.off select, .tm-row.off input[type=number] { opacity: .35; }
  .tm-rep { border: 1px solid var(--line); border-left: 3px solid var(--purple);
            border-radius: 8px; padding: .5rem .6rem; margin-bottom: .45rem;
            max-width: 35.3rem; background: rgba(176,124,255,.06); }
  .tm-rep .tm-grid { max-width: none; }
  .tm-rep-head { display: flex; align-items: center; gap: .4rem; margin-bottom: .5rem; }
  .tm-rep-head input[type=checkbox] { accent-color: var(--accent); }
  .tm-rep-head select { width: 15.4rem; background: var(--panel2); color: var(--text);
      border: 1px solid #2a3a48; border-radius: 6px; padding: .35rem; font: inherit;
      font-size: .85rem; }
  .tm-rep-head .tm-reps { width: 3.4rem; text-align: right; background: var(--panel2);
      color: var(--text); border: 1px solid #2a3a48; border-radius: 6px; padding: .3rem;
      font: inherit; font-size: .85rem; }
  .tm-rep-head .grow { flex: 1; }
  .tm-rep-label { color: var(--muted); font-size: .8rem; }
  .tm-rep.off .tm-rep-steps, .tm-rep.off .tm-reps { opacity: .35; }
  .tm-del { background: none; border: none; color: var(--muted); cursor: pointer;
            font-size: 1.15rem; line-height: 1; padding: 0; }
  .tm-del:hover { color: var(--red); }
  .tm-sum { color: var(--muted); font-size: .82rem; margin: .7rem 0 0; }
  .tm-sum b { color: var(--text); font-weight: 600; }
  .tm-link { background: none; border: none; color: var(--accent); cursor: pointer;
             font-size: .8rem; padding: 0; }
  .tm-link:hover { text-decoration: underline; }
  .tm-field { color: var(--muted); font-size: .82rem; }
  .tm-field input, .tm-text { background: var(--panel2); color: var(--text);
      border: 1px solid #2a3a48; border-radius: 6px; padding: .35rem; font: inherit; }
  .tm-field input { display: block; }
  .tm-text { width: 100%; box-sizing: border-box; border-radius: 8px; padding: .6rem;
             font-size: .9rem; resize: vertical; }
</style>
</head>
<body>
<header>
  <h1>AI Running Coach</h1>
  <span class="sub">progress dashboard</span>
  <span class="spacer"></span>
  <button id="uploadBtn" class="upload-btn">＋ Upload run (.tcx)</button>
  <button id="treadmillBtn" class="upload-btn">🏃 Log treadmill</button>
  <span id="uploadStatus" class="upload-status"></span>
  <input id="uploadInput" type="file" accept=".tcx" multiple hidden>
  <a href="/docs">API docs →</a>
</header>
<main>
  <div id="app" class="loading">Loading your running data…</div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const S_COLORS = {
  easy: '#35c46b', recovery: '#4fd0c5', progression: '#3fb6ff', fartlek: '#b07cff',
  interval: '#f2b134', benchmark: '#ef5350', family_fun: '#ff8fb0', incomplete: '#8ba0b3',
  unclassified: '#5a6b7a'
};
const charts = {};

function fmtPace(s) {
  if (!s) return '—';
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
function fmtDate(iso) { return new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric'}); }

async function j(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(url); return r.json(); }

function card(label, value, unit='') {
  return `<div class="card"><div class="label">${label}</div>
    <div class="value">${value}<span class="unit"> ${unit}</span></div></div>`;
}

function lineChart(id, labels, datasets, opts={}) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id);
  charts[id] = new Chart(ctx, {
    type: opts.type || 'line',
    data: { labels, datasets },
    options: {
      responsive: true, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#8ba0b3', boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: '#8ba0b3', maxRotation: 0, autoSkip: true }, grid: { color: '#22303d' } },
        y: { ticks: { color: '#8ba0b3' }, grid: { color: '#22303d' },
             reverse: !!opts.reverseY, title: opts.yTitle ? { display: true, text: opts.yTitle, color:'#8ba0b3' } : undefined },
        ...(opts.y1 ? { y1: { position: 'right', ticks: { color: '#8ba0b3' }, grid: { drawOnChartArea:false } } } : {})
      }
    }
  });
}

function renderOverview(d) {
  const r = d.readiness, tl = d.training_load;
  const acwr = tl.acute_chronic_ratio;
  const acwrWarn = acwr && (acwr > 1.3) ? ' warn' : '';
  const cards = [
    card('Total distance', d.totals.distance_km, 'km'),
    card('Workouts', d.totals.workouts),
    card('Total time', d.totals.duration_h, 'h'),
    `<div class="card"><div class="label">Readiness today</div>
      <div class="value"><span class="pill ${r.level}">${r.level.toUpperCase()}</span>
      <span class="unit"> ${r.score}/100</span></div></div>`,
    card('Load 7d', tl.load_7d),
    `<div class="card"><div class="label">Acute:chronic</div>
      <div class="value${acwrWarn}">${acwr ?? '—'}</div></div>`,
    d.body ? card('Weight', d.body.latest_kg, 'kg') : '',
    d.body ? card('Weight trend', (d.body.trend_kg>=0?'+':'') + d.body.trend_kg, 'kg') : '',
  ].join('');
  const reasons = r.reasons?.length ? `<ul class="reasons">${r.reasons.map(x=>`<li>${x}</li>`).join('')}</ul>` : '';
  return `<div class="cards">${cards}</div>
    <div class="panel wide" style="margin-bottom:1.1rem">
      <h2>Coach readiness — ${r.recommendation}</h2>${reasons}</div>`;
}

function chartPanels() {
  return `<div class="grid">
    <div class="panel"><h2>Distance per session</h2><p class="hint">bars = session km, line = cumulative</p><canvas id="c_distance"></canvas></div>
    <div class="panel"><h2>Pace trend</h2><p class="hint">avg pace per session (lower is faster) — dashed = treadmill main set, warmup/cooldown excluded</p><canvas id="c_pace"></canvas></div>
    <div class="panel"><h2>Training load</h2><p class="hint">per session with 3-session rolling average</p><canvas id="c_load"></canvas></div>
    <div class="panel"><h2>Avg heart rate</h2><p class="hint">per session (suspect HR down-weighted) — dashed = treadmill main set</p><canvas id="c_hr"></canvas></div>
    <div class="panel"><h2>Body weight</h2><p class="hint">rolling trend from smart scale</p><canvas id="c_weight"></canvas></div>
    <div class="panel"><h2>Session mix</h2><p class="hint">how your sessions are classified</p><canvas id="c_mix"></canvas></div>
  </div>`;
}

function workoutsTable(w) {
  const rows = w.slice().reverse().map(x => `
    <tr data-id="${x.id}">
      <td>${fmtDate(x.start_time)}</td>
      <td><span class="type" style="color:${S_COLORS[x.session_type]||'#8ba0b3'}">${x.session_type}</span></td>
      <td>${x.terrain.replace('_',' ')}</td>
      <td>${x.distance_km}</td>
      <td>${x.duration_min}</td>
      <td>${x.avg_hr ?? '—'}</td>
      <td>${fmtPace(x.avg_pace_s_per_km)}</td>
      <td>${x.main_set_avg_pace_s_per_km ? fmtPace(x.main_set_avg_pace_s_per_km) : '—'}</td>
      <td>${x.hr_suspect_fraction > 0.1 ? `<span class="warn">${Math.round(x.hr_suspect_fraction*100)}%</span>` : '—'}</td>
    </tr>`).join('');
  return `<div class="panel wide" style="margin-top:1.1rem">
    <h2>All sessions</h2><p class="hint">click a row for splits, HR, elevation and the AI narrative</p>
    <div style="overflow:auto; max-height:420px">
    <table><thead><tr><th>Date</th><th>Type</th><th>Terrain</th><th>km</th><th>min</th>
      <th>HR</th><th>Pace</th><th>Main set</th><th>HR flags</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function drawCharts(d) {
  const w = d.workouts;
  const labels = w.map(x => fmtDate(x.start_time));
  // distance + cumulative
  let cum = 0; const cumSeries = w.map(x => (cum += x.distance_km, +cum.toFixed(1)));
  lineChart('c_distance', labels, [
    { type:'bar', label:'km', data: w.map(x=>x.distance_km), backgroundColor:'#3fb6ff88', yAxisID:'y' },
    { type:'line', label:'cumulative km', data: cumSeries, borderColor:'#35c46b', tension:.3, yAxisID:'y1', pointRadius:0 },
  ], { type:'bar', y1:true });
  // pace — whole session vs main set (treadmill warmup/cooldown excluded). Sessions with
  // nothing to separate reuse their calculated value, so the series stays continuous.
  const msPace = w.map(x => x.main_set_avg_pace_s_per_km || x.avg_pace_s_per_km);
  const hasMainSetPace = w.some(x => x.main_set_avg_pace_s_per_km);
  lineChart('c_pace', labels, [
    { label:'pace (min/km)', data: w.map(x=>x.avg_pace_s_per_km? x.avg_pace_s_per_km/60 : null),
      borderColor:'#b07cff', backgroundColor:'#b07cff33', tension:.3, spanGaps:true, pointRadius:3,
      pointBackgroundColor: w.map(x=>x.terrain==='treadmill'?'#f2b134':'#b07cff') },
    ...(hasMainSetPace ? [{ label:'main-set pace (min/km)',
      data: msPace.map(p => p ? p/60 : null),
      borderColor:'#35c46b', borderDash:[6,4], tension:.3, spanGaps:false, pointRadius:2 }] : []),
  ], { reverseY:true, yTitle:'min/km' });
  // load + rolling
  const loads = w.map(x=>x.load||0);
  const roll = loads.map((_,i)=>{ const s=loads.slice(Math.max(0,i-2),i+1); return +(s.reduce((a,b)=>a+b,0)/s.length).toFixed(1); });
  lineChart('c_load', labels, [
    { type:'bar', label:'load', data:loads, backgroundColor:'#f2b13488' },
    { type:'line', label:'rolling', data:roll, borderColor:'#ef5350', tension:.3, pointRadius:0 },
  ], { type:'bar' });
  // hr — whole session vs main set, same fallback as pace
  const hasMainSetHr = w.some(x => x.main_set_avg_hr);
  lineChart('c_hr', labels, [
    { label:'avg HR', data: w.map(x=>x.avg_hr), borderColor:'#ef5350', backgroundColor:'#ef535033',
      tension:.3, spanGaps:true, pointRadius:3 },
    ...(hasMainSetHr ? [{ label:'main-set HR', data: w.map(x=>x.main_set_avg_hr || x.avg_hr),
      borderColor:'#f2b134', borderDash:[6,4], tension:.3, spanGaps:false, pointRadius:2 }] : []),
  ], { yTitle:'bpm' });
  // weight
  if (d.body && d.body.series?.length) {
    const b = d.body.series;
    lineChart('c_weight', b.map(x=>fmtDate(x.date)), [
      { label:'weight', data: b.map(x=>x.weight_kg), borderColor:'#8ba0b3', pointRadius:2, tension:.2 },
      { label:'rolling', data: b.map(x=>x.rolling_kg), borderColor:'#3fb6ff', pointRadius:0, tension:.3 },
    ], { yTitle:'kg' });
  }
  // mix doughnut
  const mix = d.session_breakdown;
  if (charts.c_mix) charts.c_mix.destroy();
  charts.c_mix = new Chart(document.getElementById('c_mix'), {
    type:'doughnut',
    data:{ labels:Object.keys(mix), datasets:[{ data:Object.values(mix),
      backgroundColor:Object.keys(mix).map(k=>S_COLORS[k]||'#5a6b7a') }] },
    options:{ plugins:{ legend:{ position:'right', labels:{ color:'#8ba0b3', boxWidth:12 } } } }
  });
}

async function openWorkout(id) {
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  modal.innerHTML = `<button class="close" onclick="closeModal()">×</button><div class="loading">Loading session…</div>`;
  overlay.classList.add('open');
  try {
    const [streams, analysis, ai] = await Promise.all([
      j(`/workouts/${id}/streams`), j(`/workouts/${id}/analysis`),
      fetch(`/ai/analyse-session`, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({workout_id:id})}).then(r=>r.json()).catch(()=>null)
    ]);
    const m = analysis.metrics;
    const eq = analysis.equivalent_flat_pace;
    const ms = analysis.metrics_main_set;
    modal.innerHTML = `<button class="close" onclick="closeModal()">×</button>
      <h3>${analysis.session_type} · ${analysis.terrain.replace('_',' ')}</h3>
      <div class="hint" style="color:var(--muted)">${new Date(analysis.start_time).toLocaleString()}</div>
      ${analysis.terrain === 'treadmill' ? `<button class="upload-btn" style="margin:.4rem 0" onclick="editTreadmill('${id}')">✏️ Edit treadmill</button>` : ''}
      <button class="upload-btn" style="margin:.4rem 0 .4rem .4rem;background:var(--red);color:#fff" onclick="deleteWorkout('${id}')">🗑 Delete</button>
      ${ai?.output?.narrative ? `<div class="narrative">🧠 ${ai.output.narrative}</div>` : ''}
      <div class="cards">
        ${card('Distance', (m.distance_m/1000).toFixed(2), 'km')}
        ${card('Moving', Math.round(m.moving_s/60), 'min')}
        ${card('Avg pace', fmtPace(m.avg_pace_s_per_km), '/km')}
        ${card('Avg HR', m.avg_hr ?? '—', 'bpm')}
        ${card('Elev gain', analysis.elevation.elevation_gain_m ?? '—', 'm')}
        ${eq.available ? card('Flat-equiv pace', fmtPace(eq.equivalent_flat_pace_s_per_km), '/km') : ''}
      </div>
      ${ms && ms.available ? `<div class="panel" style="margin-top:.8rem">
        <h2>Main set — warmup &amp; cooldown excluded</h2>
        <div class="hint" style="color:var(--muted)">Excluded ${Math.round(ms.warmup_s/60)} min warmup + ${Math.round(ms.cooldown_s/60)} min cooldown
          (${ms.trimmed_pct}% of the session)${ms.method === 'declared' ? ', from this session\'s description' : ', from your usual treadmill routine'}</div>
        <div class="cards">
          ${card('Main-set time', Math.round(ms.duration_s/60), 'min')}
          ${ms.distance_m != null ? card('Main-set distance', (ms.distance_m/1000).toFixed(2), 'km') : ''}
          ${ms.avg_pace_s_per_km ? card('Main-set pace', fmtPace(ms.avg_pace_s_per_km), '/km') : ''}
          ${card('Main-set HR', ms.avg_hr ?? '—', 'bpm')}
        </div>
        ${ms.pace_source === 'session_total_minus_easy_ends' ? `<div class="hint" style="color:var(--muted)">
          Pace estimated: this export records heart rate only, so the warmup and cooldown distance
          (${Math.round(ms.warmup_m)} m + ${Math.round(ms.cooldown_m)} m at your usual speeds) was taken off the measured session total.</div>` : ''}
        ${ms.pace_reason === 'no_distance_recorded' ? `<div class="hint" style="color:var(--muted)">
          Main-set pace unavailable: this session records no distance, and no phase speeds are known to estimate it from.</div>` : ''}
      </div>` : ''}
      <div class="panel" style="margin-top:.8rem"><h2>Pace &amp; heart rate</h2><canvas id="c_detail"></canvas></div>
      ${streams.altitude_m.some(a=>a!=null) ? `<div class="panel" style="margin-top:.8rem"><h2>Elevation</h2><canvas id="c_elev"></canvas></div>` : ''}`;
    const xs = streams.elapsed_s.map(s => (s/60).toFixed(0));
    const paceDatasets = [
      { label:'pace (min/km)', data: streams.pace_s_per_km.map(p=>p?p/60:null), borderColor:'#b07cff',
        spanGaps:true, pointRadius:0, tension:.2, yAxisID:'y' },
      { label:'HR', data: streams.hr_bpm, borderColor:'#ef5350', spanGaps:true, pointRadius:0, tension:.2, yAxisID:'y1' },
    ];
    // Overlay the reported treadmill plan pace across the minutes you described.
    const tm = analysis.treadmill_effort;
    if (tm && tm.available && tm.phases && tm.phases.length) {
      const bounds = [];
      let acc = 0;
      for (const ph of tm.phases) {
        const dur = (ph.duration_min || 0) * 60;
        const paceMin = ph.speed_mph ? (1000 / (ph.speed_mph * 0.44704)) / 60 : null;
        bounds.push({ start: acc, end: acc + dur, paceMin });
        acc += dur;
      }
      const planPace = streams.elapsed_s.map(s => {
        const b = bounds.find(b => s >= b.start && s < b.end);
        return b ? b.paceMin : null;
      });
      paceDatasets.push({ label:'plan pace (min/km)', data: planPace, borderColor:'#f2b134',
        borderDash:[6,4], stepped:true, spanGaps:false, pointRadius:0, yAxisID:'y' });
    }
    lineChart('c_detail', xs, paceDatasets, { reverseY:true, y1:true });
    if (streams.altitude_m.some(a=>a!=null)) {
      lineChart('c_elev', xs, [
        { label:'altitude (m)', data: streams.altitude_m, borderColor:'#35c46b',
          backgroundColor:'#35c46b33', fill:true, spanGaps:true, pointRadius:0, tension:.3 }
      ]);
    }
  } catch (e) {
    modal.innerHTML = `<button class="close" onclick="closeModal()">×</button><p>Could not load session.</p>`;
  }
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id==='overlay') closeModal(); });

async function deleteWorkout(id) {
  if (!confirm('Delete this session? This cannot be undone.')) return;
  try {
    const r = await fetch(`/workouts/${id}`, { method: 'DELETE' });
    if (!r.ok) throw new Error('delete failed');
    closeModal();
    await init();
  } catch (e) {
    alert('Could not delete this session.');
  }
}

function setUploadStatus(msg, cls='') {
  const el = document.getElementById('uploadStatus');
  el.textContent = msg;
  el.className = 'upload-status' + (cls ? ' ' + cls : '');
}

async function uploadFiles(files) {
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  let added = 0, skipped = 0, failed = 0;
  for (const file of files) {
    setUploadStatus(`Uploading ${file.name}…`);
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch('/workouts/upload', { method: 'POST', body: fd });
      if (!r.ok) { failed++; continue; }
      const res = await r.json();
      res.already_existed ? skipped++ : added++;
    } catch (e) { failed++; }
  }
  btn.disabled = false;
  const parts = [];
  if (added) parts.push(`${added} added`);
  if (skipped) parts.push(`${skipped} already present`);
  if (failed) parts.push(`${failed} failed`);
  setUploadStatus(parts.join(', ') || 'Nothing to import', failed ? 'err' : 'ok');
  if (added) await init();
}

document.getElementById('uploadBtn').addEventListener('click', () =>
  document.getElementById('uploadInput').click());
document.getElementById('uploadInput').addEventListener('change', e => {
  if (e.target.files.length) uploadFiles([...e.target.files]);
  e.target.value = '';
});

// ---- treadmill phase builder ------------------------------------------------
// The stored session is still the free-text description the canonical parser reads; this
// form just composes and re-reads that text so the athlete never has to type the syntax.
const TM_TYPES = [['warmup', 'Warm-up'], ['aerobic', 'Core'], ['fartlek', 'Fartlek (repeats)'],
                  ['progression', 'Push'], ['interval', 'Interval'], ['recovery', 'Recovery'],
                  ['cooldown', 'Cool-down']];
// Keyword the parser looks for per type. "Core" is the parser's default, so it needs none.
const TM_KEYWORD = { warmup: 'warmup', aerobic: '', progression: 'progression',
                     interval: 'interval', recovery: 'recovery', cooldown: 'cooldown' };
const KMH_PER_MPH = 1.60934;
// Used only if /plan can't be reached, so the form is never empty.
const TM_FALLBACK = [
  { type: 'warmup', duration_min: 10, speed_mph: 4.0, incline_pct: 1 },
  { type: 'aerobic', duration_min: 25, speed_mph: 4.7, incline_pct: 1 },
  { type: 'progression', duration_min: 5, speed_mph: 5.0, incline_pct: 1 },
  { type: 'cooldown', duration_min: 5, incline_pct: 0 },
];
// Starting point for a new fartlek/interval set.
const TM_NEW_REPEAT = { repeat: 6, phases: [
  { type: 'interval', duration_min: 1, speed_mph: 6.0, incline_pct: 1 },
  { type: 'recovery', duration_min: 2, speed_mph: 4.0, incline_pct: 1 },
] };

let _tmEditId = null;
let _tmTextMode = false;
let _tmCorePhase = null;  // the athlete's standard core, for swapping back from a fartlek

const tmNum = n => (n == null || isNaN(n)) ? '' : String(Number(Number(n).toFixed(2)));

function toLocalInput(iso) {
  // ISO timestamp -> value accepted by <input type="datetime-local"> (local time).
  const d = new Date(iso);
  const pad = n => n.toString().padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function tmPlanBlocks() {
  let phases;
  try { phases = (await j('/plan')).phases; } catch (e) { phases = TM_FALLBACK; }
  _tmCorePhase = phases.find(p => p.type === 'aerobic') || _tmCorePhase;
  return phases.map(p => ({ repeat: 1, phases: [p] }));
}

async function tmCorePhase() {
  if (!_tmCorePhase) {
    try { _tmCorePhase = (await j('/plan')).phases.find(p => p.type === 'aerobic'); } catch (e) {}
  }
  return _tmCorePhase || TM_FALLBACK.find(p => p.type === 'aerobic');
}

/** A top-level single phase row of `type`, or null. Repeat sets are skipped. */
function tmFindRow(box, type) {
  return [...box.children].find(el => !el.classList.contains('tm-rep')
    && el.querySelector('.tm-type').value === type) || null;
}

/** The session always ends on the cool-down, so new work goes in just before it. */
function tmInsertBeforeCooldown(box, html) {
  const cool = tmFindRow(box, 'cooldown');
  if (cool) cool.insertAdjacentHTML('beforebegin', html);
  else box.insertAdjacentHTML('beforeend', html);
}

function tmReplaceWith(el, html) {
  el.insertAdjacentHTML('beforebegin', html);
  el.remove();
}

/** Picking "Fartlek" turns a slot into a repeat set, and picking anything else turns it
 *  back into a single phase — so the core and the fartlek are alternatives in one control,
 *  swapped in place so the push and cool-down keep their position. */
async function tmSlotChanged(e) {
  const sel = e.target;
  if (sel.classList.contains('tm-type') && !sel.closest('.tm-rep') && sel.value === 'fartlek') {
    tmReplaceWith(sel.closest('.tm-row'), tmRepHtml(TM_NEW_REPEAT));
  } else if (sel.classList.contains('tm-type-rep') && sel.value !== 'fartlek') {
    const phase = sel.value === 'aerobic' ? await tmCorePhase() : { type: sel.value };
    tmReplaceWith(sel.closest('.tm-rep'), tmRowHtml(phase));
  }
  tmRefresh();
}

async function tmParseBlocks(description) {
  if (!description) return null;
  try {
    const r = await fetch('/workouts/treadmill/parse', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description }) });
    if (!r.ok) return null;
    return (await r.json()).blocks;
  } catch (e) { return null; }
}

/** Phase options. "Fartlek" is a container, not a phase, so nested steps can't pick it. */
function tmTypeOptions(selected, allowFartlek) {
  return TM_TYPES
    .filter(([v]) => allowFartlek || v !== 'fartlek')
    .map(([v, l]) => `<option value="${v}"${v === selected ? ' selected' : ''}>${l}</option>`)
    .join('');
}

function tmRowHtml(p, nested = false) {
  // Phases inside a repeat are included or removed with the block, so they need no checkbox.
  const lead = nested ? '<span></span>'
    : '<input type="checkbox" class="tm-on" checked title="Include this phase">';
  return `<div class="tm-grid tm-row">
    ${lead}
    <select class="tm-type">${tmTypeOptions(p.type, !nested)}</select>
    <input type="number" class="tm-dur" min="0" step="1" value="${tmNum(p.duration_min)}">
    <input type="number" class="tm-spd" min="0" step="0.1" value="${tmNum(p.speed_mph)}">
    <input type="number" class="tm-inc" min="0" step="0.5" value="${tmNum(p.incline_pct)}">
    <button type="button" class="tm-del" title="Remove phase">×</button>
  </div>`;
}

function tmRepHtml(block) {
  return `<div class="tm-rep">
    <div class="tm-rep-head">
      <input type="checkbox" class="tm-on-rep" checked title="Include this set">
      <select class="tm-type-rep" title="Switch this slot back to a steady phase">
        ${tmTypeOptions('fartlek', true)}</select>
      <input type="number" class="tm-reps" min="1" step="1" value="${block.repeat}">
      <span class="tm-rep-label">× times</span>
      <span class="grow"></span>
      <button type="button" class="tm-link tm-add-step">+ step</button>
      <button type="button" class="tm-del-rep tm-del" title="Remove set">×</button>
    </div>
    <div class="tm-rep-steps">${block.phases.map(p => tmRowHtml(p, true)).join('')}</div>
  </div>`;
}

const tmBlockHtml = b =>
  (b.repeat > 1 || b.phases.length > 1) ? tmRepHtml(b) : tmRowHtml(b.phases[0]);

function tmReadRow(r) {
  const num = sel => { const v = r.querySelector(sel).value; return v === '' ? null : parseFloat(v); };
  return { type: r.querySelector('.tm-type').value, duration_min: num('.tm-dur'),
           speed_mph: num('.tm-spd'), incline_pct: num('.tm-inc') };
}

function tmBlocks() {
  return [...document.getElementById('tmPhases').children].map(el => {
    const isRep = el.classList.contains('tm-rep');
    const box = isRep ? el.querySelector('.tm-on-rep') : el.querySelector('.tm-on');
    return {
      repeat: isRep ? Math.max(1, parseInt(el.querySelector('.tm-reps').value, 10) || 1) : 1,
      on: box.checked,
      phases: isRep ? [...el.querySelectorAll('.tm-row')].map(tmReadRow) : [tmReadRow(el)],
    };
  });
}

function tmPhaseText(p) {
  const bits = [`${tmNum(p.duration_min)} min`];
  if (TM_KEYWORD[p.type]) bits.push(TM_KEYWORD[p.type]);
  if (p.speed_mph > 0) bits.push(`at ${tmNum(p.speed_mph)}mph`);
  if (p.incline_pct != null) bits.push(`with ${tmNum(p.incline_pct)}%`);
  return bits.join(' ');
}

function tmDescription() {
  const lines = [];
  for (const b of tmBlocks()) {
    if (!b.on) continue;
    const steps = b.phases.filter(p => p.duration_min > 0).map(tmPhaseText);
    if (!steps.length) continue;
    // Only a real repeat gets the compact "N x (...)" form; otherwise one phase per line,
    // which is what the parser expects.
    if (b.repeat > 1) lines.push(`${b.repeat} x (${steps.join(' + ')})`);
    else lines.push(...steps);
  }
  return lines.join('\n');
}

// Mirrors DEFAULT_COOLDOWN_RAMP_MPH on the server: one step per minute.
const TM_COOLDOWN_RAMP = [4.5, 4.0, 3.5, 3.0, 2.5];

// Distance a phase covers, in km. A cooldown left without a speed walks the standard ramp.
function tmPhaseKm(p) {
  if (!(p.duration_min > 0)) return 0;
  if (p.speed_mph > 0) return p.speed_mph * KMH_PER_MPH * p.duration_min / 60;
  if (p.type !== 'cooldown') return 0;
  let mph_min = 0;
  for (let m = 0; m < Math.ceil(p.duration_min); m++) {
    const step = TM_COOLDOWN_RAMP[Math.min(m, TM_COOLDOWN_RAMP.length - 1)];
    mph_min += step * Math.min(1, p.duration_min - m);
  }
  return mph_min * KMH_PER_MPH / 60;
}

function tmRefresh() {
  for (const el of document.getElementById('tmPhases').children) {
    const box = el.querySelector('.tm-on-rep') || el.querySelector('.tm-on');
    el.classList.toggle('off', box ? !box.checked : false);
  }
  // The cooldown ramp is fixed, so its speed box is optional and says so.
  document.querySelectorAll('#tmPhases .tm-row').forEach(r => {
    const cooling = r.querySelector('.tm-type').value === 'cooldown';
    r.querySelector('.tm-spd').placeholder = cooling ? 'ramp' : '';
  });
  let mins = 0, km = 0;
  for (const b of tmBlocks()) {
    if (!b.on) continue;
    for (const p of b.phases) {
      if (!(p.duration_min > 0)) continue;
      mins += p.duration_min * b.repeat;
      km += tmPhaseKm(p) * b.repeat;
    }
  }
  const el = document.getElementById('tmSum');
  if (el) el.innerHTML = mins
    ? `<b>${tmNum(mins)} min</b> total · about <b>${km.toFixed(2)} km</b> at these speeds`
    : 'Add at least one phase with a duration.';
}

async function openTreadmillModal(prefill = null) {
  const modal = document.getElementById('modal');
  modal.innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('overlay').classList.add('open');

  const editing = !!prefill;
  _tmEditId = editing ? (prefill.workout_id || null) : null;
  _tmTextMode = false;
  // A session recorded by the watch keeps its measured HR/pace; the text is only a note.
  const deviceRecorded = editing && prefill.source && prefill.source !== 'manual_treadmill';

  let blocks, rawText = '';
  if (editing && prefill.description) {
    rawText = prefill.description;
    blocks = await tmParseBlocks(rawText);
    if (!blocks) { _tmTextMode = true; blocks = []; }  // legacy free text: edit it as-is
  } else {
    blocks = await tmPlanBlocks();
  }

  const startVal = editing && prefill.start_time ? toLocalInput(prefill.start_time) : '';
  const hrVal = editing && prefill.avg_hr != null ? prefill.avg_hr : '';
  const deviceNote = deviceRecorded
    ? `<p style="color:var(--green);font-size:.82rem;margin:.2rem 0 .6rem">
        ✔ Recorded by your watch — measured heart rate and distance are kept. These phases add
        the speed and incline the watch could not see.</p>`
    : '';
  const measuredFields = deviceRecorded ? '' : `
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0 0">
      <label class="tm-field">Date/time
        <input id="tmStart" type="datetime-local" value="${startVal}"></label>
      <label class="tm-field">Avg HR (optional)
        <input id="tmHr" type="number" min="60" max="220" placeholder="—" value="${hrVal}"
          style="width:6rem"></label>
    </div>`;

  modal.innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <h3>${editing ? 'Edit treadmill session' : 'Log treadmill session'}</h3>
    <p style="color:var(--muted);font-size:.85rem;margin:.2rem 0 .7rem">
      No GPS on the treadmill — set the phases you ran and the coach works out the rest.</p>
    ${deviceNote}
    <div id="tmBuilder"${_tmTextMode ? ' hidden' : ''}>
      <div class="tm-grid">
        <span></span><span class="head">Phase</span><span class="head">Min</span>
        <span class="head">mph</span><span class="head">Incline %</span><span></span>
      </div>
      <div id="tmPhases">${blocks.map(tmBlockHtml).join('')}</div>
      <div style="display:flex;gap:1.1rem;align-items:center;margin-top:.5rem;flex-wrap:wrap">
        <button type="button" class="tm-link" id="tmAdd">+ Add phase</button>
        <button type="button" class="tm-link" id="tmReset">Reset to my standard</button>
      </div>
      <p class="tm-sum" id="tmSum"></p>
      <p class="tm-sum">Core or Fartlek is your choice in the Phase column. Leave the
        cool-down speed empty — it always walks down 4.5 → 2.5 mph over 5 minutes.</p>
    </div>
    <div id="tmTextWrap"${_tmTextMode ? '' : ' hidden'}>
      <textarea id="tmText" rows="6" class="tm-text"
        placeholder="10 min warmup at 4mph">${rawText}</textarea>
    </div>
    ${measuredFields}
    <div style="display:flex;align-items:center;gap:.9rem;margin-top:.9rem;flex-wrap:wrap">
      <button id="tmSave" class="upload-btn">${editing ? 'Update session' : 'Save session'}</button>
      <button type="button" class="tm-link" id="tmMode">
        ${_tmTextMode ? 'Use the phase form' : 'Edit as text'}</button>
      <span id="tmStatus" class="upload-status"></span>
    </div>`;

  const phasesEl = document.getElementById('tmPhases');
  phasesEl.addEventListener('input', tmRefresh);
  phasesEl.addEventListener('change', tmSlotChanged);
  phasesEl.addEventListener('click', async e => {
    if (e.target.classList.contains('tm-del-rep')) {
      e.target.closest('.tm-rep').remove();
    } else if (e.target.classList.contains('tm-add-step')) {
      e.target.closest('.tm-rep').querySelector('.tm-rep-steps')
        .insertAdjacentHTML('beforeend', tmRowHtml({ type: 'recovery' }, true));
    } else if (e.target.classList.contains('tm-del')) {
      const row = e.target.closest('.tm-row');
      const set = row.closest('.tm-rep');
      row.remove();
      // A set with no steps left has nothing to repeat.
      if (set && !set.querySelector('.tm-row')) set.remove();
    } else {
      return;
    }
    tmRefresh();
  });
  document.getElementById('tmAdd').addEventListener('click', () => {
    tmInsertBeforeCooldown(phasesEl, tmRowHtml({ type: 'aerobic' }));
    tmRefresh();
  });
  document.getElementById('tmReset').addEventListener('click', async () => {
    phasesEl.innerHTML = (await tmPlanBlocks()).map(tmBlockHtml).join('');
    tmRefresh();
  });
  document.getElementById('tmMode').addEventListener('click', tmToggleMode);
  document.getElementById('tmSave').addEventListener('click', saveTreadmill);
  tmRefresh();
}

async function tmToggleMode() {
  const status = document.getElementById('tmStatus');
  if (_tmTextMode) {
    const blocks = await tmParseBlocks(document.getElementById('tmText').value.trim());
    if (!blocks) {
      status.textContent = 'Could not read that as phases — each line needs a duration';
      status.className = 'upload-status err';
      return;
    }
    document.getElementById('tmPhases').innerHTML = blocks.map(tmBlockHtml).join('');
    _tmTextMode = false;
  } else {
    document.getElementById('tmText').value = tmDescription();
    _tmTextMode = true;
  }
  status.textContent = ''; status.className = 'upload-status';
  document.getElementById('tmBuilder').hidden = _tmTextMode;
  document.getElementById('tmTextWrap').hidden = !_tmTextMode;
  document.getElementById('tmMode').textContent =
    _tmTextMode ? 'Use the phase form' : 'Edit as text';
  tmRefresh();
}

async function editTreadmill(id) {
  try {
    const w = await j(`/workouts/${id}`);
    await openTreadmillModal({ workout_id: id, description: w.notes || '', start_time: w.start_time,
      avg_hr: w.avg_hr, source: w.source });
  } catch (e) {
    await openTreadmillModal();
  }
}

async function saveTreadmill() {
  const btn = document.getElementById('tmSave');
  const status = document.getElementById('tmStatus');
  const description = _tmTextMode
    ? document.getElementById('tmText').value.trim()
    : tmDescription();
  if (!description) { status.textContent = 'Add at least one phase first'; status.className = 'upload-status err'; return; }
  const payload = { description };
  if (_tmEditId) payload.workout_id = _tmEditId;
  const startEl = document.getElementById('tmStart');
  if (startEl && startEl.value) payload.start_time = new Date(startEl.value).toISOString();
  const hrEl = document.getElementById('tmHr');
  if (hrEl && hrEl.value) payload.avg_hr = parseInt(hrEl.value, 10);
  btn.disabled = true;
  status.textContent = 'Saving…'; status.className = 'upload-status';
  try {
    const r = await fetch('/workouts/treadmill', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload) });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || 'save failed');
    }
    const res = await r.json();
    status.textContent = `Saved: ${res.distance_km} km, ${res.duration_min} min`;
    status.className = 'upload-status ok';
    setTimeout(closeModal, 900);
    await init();
  } catch (e) {
    status.textContent = e.message; status.className = 'upload-status err';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('treadmillBtn').addEventListener('click', () => openTreadmillModal());

async function init() {
  const app = document.getElementById('app');
  try {
    const d = await j('/summary');
    if (!d.totals.workouts) {
      app.innerHTML = `<div class="panel"><h2>No data yet</h2>
        <p class="hint">Import your files first:</p>
        <pre>running-coach import --raw .. --db data/coach.db</pre></div>`;
      return;
    }
    app.classList.remove('loading');
    app.innerHTML = renderOverview(d) + chartPanels() + workoutsTable(d.workouts);
    drawCharts(d);
    document.querySelectorAll('tbody tr').forEach(tr =>
      tr.addEventListener('click', () => openWorkout(tr.dataset.id)));
  } catch (e) {
    app.innerHTML = `<div class="panel"><h2>Could not reach the API</h2>
      <p class="hint">Is the server running? ${e}</p></div>`;
  }
}
init();
</script>
</body>
</html>
